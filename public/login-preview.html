}
.badge svg{width:17px;height:16.27px;position:relative;top:-1px;flex:0 0 auto;display:block;}
#badgeTxt{font-size:var(--badge-fs);font-weight:var(--badge-fw);letter-spacing:var(--badge-ls);word-spacing:var(--badge-ws);transform:translateY(var(--badge-dy));}

.hl-wrap{position:static;}
.hl{
  position:absolute;line-height:var(--hl-lh);color:var(--ink);white-space:nowrap;
  font-family:'Eloquia',sans-serif;font-variation-settings:'wght' var(--hl-wght);
  /* light halo: keeps the black headline legible when dark feathers drift behind it */
  text-shadow:0 1px 2px rgba(255,255,255,.55), 0 0 18px rgba(255,255,255,.42);
}
#hl1{left:var(--hl1-left);top:var(--hl1-top);font-size:var(--hl1-fs);letter-spacing:var(--hl1-ls);word-spacing:var(--hl1-ws);}
#hl2{left:var(--hl2-left);top:var(--hl2-top);font-size:var(--hl2-fs);letter-spacing:var(--hl2-ls);}

/* ============================================================
   PANE / CARD (desktop base)
   ============================================================ */
.pane{position:absolute;left:57.1038%;right:0;top:0;bottom:0;}
.card{
  position:absolute;left:1px;top:14px;width:613px;height:922px;border-radius:26px;overflow:hidden;
  background:rgba(254,254,254,.90);
  backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
  border:1px solid rgba(0,0,0,.036);
  box-shadow:var(--card-shadow);
}
.card-in{position:relative;width:613px;height:922px;transform-origin:left top;}

.col{position:absolute;left:62px;width:488px;}
.center{text-align:center;}

#h1{
  top:var(--h1-top);
  font-family:'Eloquia',sans-serif;font-variation-settings:'wght' var(--h1-wght);
  font-size:var(--h1-fs);letter-spacing:var(--h1-ls);word-spacing:var(--h1-ws);
  color:var(--h1-color);line-height:1;
}
#sub{
  top:var(--sub-top);
  font-size:var(--sub-fs);letter-spacing:var(--sub-ls);word-spacing:var(--sub-ws);
  font-weight:var(--sub-fw);color:var(--sub-grey);line-height:1.3;
}
#sub b{font-weight:var(--sub-fwb);color:var(--sub-grey);}

.field{position:absolute;left:62px;width:489px;display:flex;align-items:center;border-radius:12px;overflow:hidden;}
#email{top:203px;height:61px;background:var(--inputFill);border:1.5px solid var(--inputBorder);}
#pw{top:273.5px;height:59px;background:var(--pwFill);border:0;}
.field input{width:100%;height:100%;border:0;background:transparent;outline:none;font-family:inherit;color:#141414;}
#email input{font-size:var(--eph-fs);letter-spacing:var(--eph-ls);padding-left:var(--eph-left);font-weight:var(--eph-fw);word-spacing:var(--eph-ws);}
#pw input{font-size:var(--pph-fs);letter-spacing:var(--pph-ls);padding-left:var(--pph-left);font-weight:var(--pph-fw);}
.field input::placeholder{color:var(--ph);opacity:1;}

#loginBtn{
  position:absolute;left:62px;top:366px;width:489px;height:65.5px;border:0;cursor:pointer;
  border-radius:999px;background:linear-gradient(180deg,var(--btn1) 0%,var(--btn2) 100%);color:#fff;
  display:flex;align-items:center;justify-content:center;gap:var(--login-gap);
  padding-left:var(--login-padl);padding-right:4px;
  box-shadow:0 8px 20px rgba(18,26,34,.16), 0 2px 5px rgba(18,26,34,.10);
  font-family:inherit;font-size:var(--login-fs);font-weight:var(--login-fw);letter-spacing:var(--login-ls);
  transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s ease, filter .18s ease;
}
#loginBtn span{transform:translateY(var(--login-dy));}
#loginBtn svg{width:var(--arrow-w);height:var(--arrow-w);flex:0 0 auto;display:block;}
#loginBtn:hover{filter:brightness(1.12);}
#loginBtn:active{transform:translateY(1px);}

#bottom{
  position:absolute;left:62px;width:489px;top:var(--bt-top);text-align:center;
  font-size:var(--bt-fs);font-weight:var(--bt-fw);letter-spacing:var(--bt-ls);word-spacing:var(--bt-ws);
  color:var(--bottom);
}
#bottom a{color:#000;font-weight:var(--bt-fwb);text-decoration:underline;text-underline-offset:var(--bt-uo);text-decoration-thickness:2px;}

:focus-visible{outline:2px solid #2b6cb0;outline-offset:2px;}

/* ============================================================
   MODE B — TABLET PORTRAIT  (body.tabport)  fluid card
   ============================================================ */
body.tabport{overflow:auto;}
body.tabport .stage{position:relative;inset:auto;height:auto;min-height:100%;overflow:visible;}
body.tabport .photo{position:relative;left:0;top:0;width:100%;height:var(--band-h);}
body.tabport .photo-img--tall{display:none;}
body.tabport .photo-img--wide{display:block;object-position:50% 50%;}
body.tabport .scrim{display:none;}
body.tabport .hero{
  position:absolute;left:0;right:0;bottom:var(--tp-hero-b);width:auto;height:auto;transform:none;
  display:flex;flex-direction:column;align-items:flex-start;gap:var(--tp-hero-gap);
  padding:0 var(--tp-hero-side);
}
body.tabport .badge{position:static;transform:scale(var(--badge-k));transform-origin:left center;}
body.tabport .hl-wrap{position:relative;width:100%;}
body.tabport .hl{position:static;display:block;color:var(--ink);white-space:normal;font-size:var(--tp-hero-fs);line-height:var(--tp-hero-lh);}
body.tabport #hl1{letter-spacing:-.028em;}
body.tabport #hl2{letter-spacing:-.028em;}

body.tabport .pane{position:relative;left:0;right:auto;top:auto;bottom:auto;}
body.tabport .card{position:relative;overflow:hidden;}
body.tabport .card-in{position:absolute;inset:0;width:auto;height:auto;transform:none;}
body.tabport .col{left:var(--tp-pad);width:calc(100% - 2*var(--tp-pad));}
body.tabport #h1{top:var(--tp-h1-top);font-size:var(--tp-h1-fs);letter-spacing:-.06em;}
body.tabport #sub{top:var(--tp-sub-top);font-size:var(--tp-sub-fs);letter-spacing:-.012em;}
body.tabport .field{left:var(--tp-pad);width:calc(100% - 2*var(--tp-pad));border-radius:var(--tp-em-r);}
body.tabport #email{top:var(--tp-em-top);height:var(--tp-em-h);}
body.tabport #pw{top:var(--tp-pw-top);height:var(--tp-pw-h);}
body.tabport .field input{font-size:var(--tp-eph-fs);padding-left:var(--tp-eph-pad);}
body.tabport #loginBtn{left:var(--tp-pad);width:calc(100% - 2*var(--tp-pad));top:var(--tp-btn-top);height:var(--tp-btn-h);font-size:var(--tp-btn-fs);gap:var(--tp-btn-gap);padding-left:0;padding-right:0;}
body.tabport #loginBtn svg{width:var(--tp-arrow);height:var(--tp-arrow);}
body.tabport #bottom{left:var(--tp-pad);width:calc(100% - 2*var(--tp-pad));top:var(--tp-bt-top);font-size:var(--tp-bt-fs);}

/* ============================================================
   MODE C — PHONE  (body.stacked)  document flow
   ============================================================ */
body.stacked{height:auto;min-height:100%;overflow-y:auto;background:#fff;}
body.stacked .stage{position:relative;inset:auto;display:flex;flex-direction:column;min-height:100svh;overflow:visible;}
body.stacked .photo{position:relative;left:0;top:0;width:100%;height:var(--mobile-hero-h);}
body.stacked .photo-img--tall{display:none;}
body.stacked .photo-img--wide{display:block;object-position:64% 48%;transform:scale(1.015);}
body.stacked .scrim{display:block;background:linear-gradient(180deg,rgba(7,10,13,.02) 18%,rgba(7,10,13,.12) 48%,rgba(7,10,13,.78) 100%);}
body.stacked .hero{
  position:absolute;left:0;right:0;bottom:0;width:auto;height:auto;transform:none;
  display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:0 20px 18px;
}
body.stacked .badge{position:static;height:31px;padding:0 12px;background:rgba(24,27,30,.82);box-shadow:0 4px 16px rgba(0,0,0,.18);}
body.stacked #badgeTxt{font-size:11px;}
body.stacked .hl-wrap{position:relative;width:100%;}
body.stacked .hl{position:static;display:block;color:#fff;font-size:clamp(30px,8.8vw,38px);letter-spacing:-.035em;line-height:.96;text-shadow:0 2px 18px rgba(0,0,0,.32);white-space:normal;}

body.stacked .pane{position:relative;left:0;right:auto;top:auto;bottom:auto;display:flex;flex:1 1 auto;}
body.stacked .card{
  position:relative;left:auto;top:auto;width:100%;height:auto;flex:1 1 auto;
  margin:-28px 0 0;border-radius:28px 28px 0 0;background:#fff;border:0;
  box-shadow:0 -10px 28px rgba(20,28,36,.10);backdrop-filter:none;-webkit-backdrop-filter:none;
  min-height:calc(100svh - var(--mobile-hero-h) + 28px);
}
body.stacked .card-in{
  position:static;inset:auto;transform:none;width:100%;height:auto;max-width:500px;margin:0 auto;
  padding:36px clamp(24px,7vw,38px) max(30px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;justify-content:center;
}
body.stacked .card-in>*{position:static;left:auto;top:auto;width:100%;}
body.stacked #h1{font-size:clamp(31px,8.8vw,38px);letter-spacing:-.04em;margin:0 0 6px;}
body.stacked #sub{font-size:15px;margin:0 0 22px;}
body.stacked .field{margin:0 0 14px;height:56px;border-radius:12px;}
body.stacked #email,body.stacked #pw{height:56px;}
body.stacked .field input{font-size:16px;}
body.stacked #loginBtn{height:58px;margin:8px 0 0;padding:0;}
body.stacked #bottom{margin:22px 0 0;font-size:14px;}

@media (max-width:370px){
  body.stacked .photo{height:232px;}
  body.stacked .card-in{padding:30px 20px max(24px,env(safe-area-inset-bottom));}
  body.stacked .hl{font-size:30px;}
}
@media (max-height:520px) and (orientation:landscape){
  body.stacked .photo{height:208px;}
  body.stacked .card-in{justify-content:flex-start;}
}

/* ============================================================
   ENTRANCE — first-frame states (CSS guard)
   ============================================================ */
html.entry-pending .card,
html.entry-pending .badge,
html.entry-pending #hl1,
html.entry-pending #hl2,
html.entry-pending #h1,
html.entry-pending #sub,
html.entry-pending #email,
html.entry-pending #pw,
html.entry-pending #loginBtn,
html.entry-pending #bottom{opacity:0;will-change:transform,opacity,clip-path;}
html.entry-pending .card{transform:translateY(12px) scale(.988);}
html.entry-pending .badge{transform:translateY(8px);}
html.entry-pending #hl1,html.entry-pending #hl2{transform:translateY(16px);clip-path:inset(100% 0 0 0);}
html.entry-pending #h1,html.entry-pending #sub{transform:translateY(10px);}
html.entry-pending #email,html.entry-pending #pw,html.entry-pending #loginBtn{transform:translateY(8px);}
html.entry-pending #bottom{transform:translateY(6px);}
@media (max-width:699px){
  html.entry-pending .card{transform:translateY(14px);}
  html.entry-pending #hl1,html.entry-pending #hl2{transform:translateY(12px);clip-path:inset(100% 0 0 0);}
}
@media (prefers-reduced-motion:reduce){
  html.entry-pending .card,
  html.entry-pending .badge,
  html.entry-pending #hl1,
  html.entry-pending #hl2,
  html.entry-pending #h1,
  html.entry-pending #sub,
  html.entry-pending #email,
  html.entry-pending #pw,
  html.entry-pending #loginBtn,
  html.entry-pending #bottom{opacity:1!important;transform:none!important;clip-path:none!important;will-change:auto!important;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>

(function(){
  var REF_W=1464, REF_H=949, PHOTO_W=836, PANE_W=628, CARD_W=613, CARD_H=922;
  var CONTENT_H=697;
  var IMG_W=1177, IMG_H=1336, IMG_REF_SCALE=836/1177;
  var PANE_RATIO=PANE_W/REF_W;
  var HERO_W=681, HERO_H=219;
  var REF_CARD_ASPECT=692/855;
  var RAMP_HI=1280, RAMP_LO=1000, PHOTO_MIN=0.42;
  var RAMP_LO2=820, PHOTO_MIN2=0.36;
  var TP={"pad":0.1076,"h1Top":0.08656,"h1Fs":0.06839,"subTop":0.17368,"subFs":0.0309,"emTop":0.25435,"emH":0.10257,"emR":0.0202,"ephFs":0.02702,"ephPad":0.0332,"pwTop":0.36851,"pwH":0.10839,"btnTop":0.50435,"btnH":0.10981,"btnFs":0.0275,"arrow":0.026,"btnGap":0.02,"btTop":0.89668,"btFs":0.02876,"heroFs":0.1058,"badgeH":0.0742,"heroLh":1.1246,"heroBot":0.06493,"heroGap":-0.30423,"heroSide":0.0525};

  var root=document.documentElement, body=document.body;
  var photo=document.querySelector('.photo');
  var pane=document.querySelector('.pane');
  var card=document.getElementById('card');
  var cardIn=document.getElementById('cardIn');
  var hero=document.getElementById('hero');

  var mqLandscape=window.matchMedia('(min-width:700px) and (min-aspect-ratio:51/50)');
  var mqPortrait =window.matchMedia('(min-width:700px) and (max-aspect-ratio:51/50)');

  var curMode=null;

  function clearInline(){
    [photo,pane,card,cardIn,hero].forEach(function(el){ if(el) el.style.cssText=''; });
  }
  function setMode(m){
    if(curMode===m) return;
    body.classList.remove('land','tabport','stacked');
    if(m==='land') body.classList.add('land');
    else if(m==='tabport') body.classList.add('tabport');
    else body.classList.add('stacked');
    curMode=m;
  }
  function sv(k,v){ root.style.setProperty(k, v+'px'); }

  function photoRatio(vw){
    var base=1-PANE_RATIO;
    if(vw>=RAMP_HI) return base;
    if(vw>=RAMP_LO){
      var t=(vw-RAMP_LO)/(RAMP_HI-RAMP_LO);
      return PHOTO_MIN + (base-PHOTO_MIN)*t;
    }
    if(vw>=RAMP_LO2){
      var t2=(vw-RAMP_LO2)/(RAMP_LO-RAMP_LO2);
      return PHOTO_MIN2 + (PHOTO_MIN-PHOTO_MIN2)*t2;
    }
    return PHOTO_MIN2;
  }

  function placeCard(paneW, vh){
    var cs=Math.min(paneW/PANE_W, vh/CONTENT_H);
    var gapL=1*cs, mT=14*cs, mB=13*cs, mR=14*cs;
    var cw=Math.max(CARD_W*cs, paneW-gapL-mR);
    var ch=vh-mT-mB;
    card.style.position='absolute';
    card.style.left=gapL+'px';
    card.style.top=mT+'px';
    card.style.width=cw+'px';
    card.style.height=ch+'px';
    card.style.borderRadius=(26*cs)+'px';
    card.style.borderWidth=Math.max(1,cs)+'px';
    cardIn.style.transformOrigin='left top';
    cardIn.style.transform='translate('+((cw-CARD_W*cs)/2)+'px,0) scale('+cs+')';
    root.style.setProperty('--cs', cs);
    return cs;
  }

  function seatHero(photoW, vh){
    var bandH=vh;
    var imgScale=Math.max(photoW/IMG_W, bandH/IMG_H);
    var s=Math.min(imgScale/IMG_REF_SCALE, photoW*0.92/HERO_W);
    hero.style.transformOrigin='left bottom';
    hero.style.left='0';
    hero.style.bottom='0';
    hero.style.transform='scale('+s+')';
  }

  function layoutLand(){
    var vw=window.innerWidth, vh=window.innerHeight;
    var pr=photoRatio(vw);
    var photoW=vw*pr;
    photo.style.left='0'; photo.style.top='0';
    photo.style.height='100%';
    photo.style.width=(pr*100)+'%';
    pane.style.left=(pr*100)+'%';
    pane.style.right='0'; pane.style.top='0'; pane.style.bottom='0';
    var paneW=vw-photoW;
    placeCard(paneW, vh);
    seatHero(photoW, vh);
  }

  function layoutTab(){
    var vw=window.innerWidth, vh=window.innerHeight;
    var band=Math.round(vh*0.425);
    var side=Math.round(vw*0.0525);
    var footer=Math.round(vh*0.0297);
    sv('--band-h', band);

    var cardW=vw-side*2;
    var cardH=vh-band-footer;
    card.style.left=side+'px';
    card.style.top=band+'px';
    card.style.width=cardW+'px';
    card.style.height=cardH+'px';

    var S=Math.min(cardH, cardW*REF_CARD_ASPECT);
    sv('--tp-pad',      TP.pad*cardW);
    sv('--tp-h1-top',   TP.h1Top*cardH);
    sv('--tp-h1-fs',    TP.h1Fs*S);
    sv('--tp-sub-top',  TP.subTop*cardH);
    sv('--tp-sub-fs',   TP.subFs*S);
    sv('--tp-em-top',   TP.emTop*cardH);
    sv('--tp-em-h',     TP.emH*cardH);
    sv('--tp-em-r',     TP.emR*S);
    sv('--tp-eph-fs',   TP.ephFs*S);
    sv('--tp-eph-pad',  TP.ephPad*cardW);
    sv('--tp-pw-top',   TP.pwTop*cardH);
    sv('--tp-pw-h',     TP.pwH*cardH);
    sv('--tp-btn-top',  TP.btnTop*cardH);
    sv('--tp-btn-h',    TP.btnH*cardH);
    sv('--tp-btn-fs',   TP.btnFs*S);
    sv('--tp-arrow',    TP.arrow*S);
    sv('--tp-btn-gap',  TP.btnGap*cardW);
    sv('--tp-bt-top',  (TP.btnTop+TP.btnH+0.045)*cardH);
    sv('--tp-bt-fs',    TP.btFs*S);
    sv('--tp-hero-b',   TP.heroBot*band);
    sv('--tp-hero-gap', TP.heroGap*band);
    sv('--tp-hero-side',vw*TP.heroSide);
    sv('--tp-hero-fs',  TP.heroFs*band);
    root.style.setProperty('--tp-hero-lh', TP.heroLh);
    root.style.setProperty('--badge-k', band*TP.badgeH/37);
  }

  function layout(){
    var vw=window.innerWidth;
    var mode;
    if(vw<700) mode='phone';
    else if(mqPortrait.matches) mode='tabport';
    else mode='land';
    clearInline();
    setMode(mode);
    if(mode==='land') layoutLand();
    else if(mode==='tabport') layoutTab();
    /* phone: intentionally empty — CSS owns document flow, no stale inline values */
  }

  window.addEventListener('resize', layout, {passive:true});
  window.addEventListener('orientationchange', layout);
  if(mqLandscape.addEventListener){ mqLandscape.addEventListener('change', layout); mqPortrait.addEventListener('change', layout); }
  else if(mqLandscape.addListener){ mqLandscape.addListener(layout); mqPortrait.addListener(layout); }
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(layout); }
  layout();
})();

/* ============================================================
   ENTRANCE ANIMATION  (runs once)
   ============================================================ */
function releaseEntrance(){
  document.documentElement.classList.remove('entry-pending');
  if(window.__entryFallback){ clearTimeout(window.__entryFallback); window.__entryFallback=null; }
}
(function(){
  var reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce || !Element.prototype.animate){ releaseEntrance(); return; }
  var q=function(s){ return document.querySelector(s); };

  function run(){
    var ease='cubic-bezier(.16,1,.3,1)', softEase='cubic-bezier(.22,1,.36,1)';
    var compact=window.matchMedia('(max-width:699px)').matches;
    var cardFrom=compact ? {opacity:0,transform:'translateY(14px)'} : {opacity:0,transform:'translateY(12px) scale(.988)'};
    var hlY=compact ? '12px' : '16px';
    var hlFrom={opacity:0,transform:'translateY('+hlY+')',clipPath:'inset(100% 0 0 0)'};
    var hlTo={opacity:1,transform:'none',clipPath:'inset(0 0 0 0)'};
    var to={opacity:1,transform:'none'};

    var steps=[
      [q('#card'),   cardFrom,                                     to,    40, 820, ease],
      [q('.badge'),  {opacity:0,transform:'translateY(8px)'},      to,   120, 480, softEase],
      [q('#hl1'),    hlFrom,                                       hlTo, 240, 760, ease],
      [q('#hl2'),    hlFrom,                                       hlTo, 330, 760, ease],
      [q('#h1'),     {opacity:0,transform:'translateY(10px)'},     to,   470, 620, ease],
      [q('#sub'),    {opacity:0,transform:'translateY(10px)'},     to,   570, 560, ease],
      [q('#email'),  {opacity:0,transform:'translateY(8px)'},      to,   720, 520, softEase],
      [q('#pw'),     {opacity:0,transform:'translateY(8px)'},      to,   790, 520, softEase],
      [q('#loginBtn'),{opacity:0,transform:'translateY(8px)'},     to,   930, 560, ease],
      [q('#bottom'), {opacity:0,transform:'translateY(6px)'},      to,  1120, 500, softEase]
    ];

    var animations=[];
    steps.forEach(function(s){
      if(!s[0]) return;
      animations.push(s[0].animate([s[1],s[2]], {delay:s[3],duration:s[4],easing:s[5],fill:'both'}));
    });

    document.documentElement.classList.remove('entry-pending');

    Promise.allSettled(animations.map(function(a){ return a.finished; })).then(function(){
      animations.forEach(function(a){ a.cancel(); });
      animations.length=0;
      releaseEntrance();
    });
  }

  Promise.race([
    document.fonts ? document.fonts.ready : Promise.resolve(),
    new Promise(function(r){ setTimeout(r,650); })
  ]).then(function(){
    requestAnimationFrame(function(){ requestAnimationFrame(run); });
  });
})();
</script>
